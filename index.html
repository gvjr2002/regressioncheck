<!DOCTYPE html>
<html lang="en">
<head>
  <script referrerpolicy="no-referrer-when-downgrade" src="https://dev.visualwebsiteoptimizer.com/cloud-run-test/final/29000586.js" id="vwoCode"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Element Available After 2 Seconds</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    #delayed-element {
      padding: 20px;
      background: #d4f5d4;
      border: 1px solid #4caf50;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Delayed Element Example</h1>

  <p>Element will appear after 2 seconds...</p>

  <div id="delayed-element">
    ✅ Element is now available after 2 seconds
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("delayed-element").style.display = "block";
      console.log("Element is now available");
    }, 2000);
  </script>

</body>
</html>
