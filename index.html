<!DOCTYPE html>
<html lang="en">
<head>
    <script referrerpolicy="no-referrer-when-downgrade" src="https://dev.visualwebsiteoptimizer.com/cloud-run-test/final/29000586.js" id="vwoCode"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multiple Dynamic Elements</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .dynamic-box {
      padding: 20px;
      margin-top: 20px;
      border-radius: 6px;
      font-weight: bold;
    }

    #element-1 {
      background: #d4f5d4;
      border: 1px solid #4caf50;
    }

    #element-2 {
      background: #dbeafe;
      border: 1px solid #3b82f6;
    }
  </style>
</head>
<body>

  <h1>Dynamic DOM Injection Example</h1>

  <p>
    Element 1 will be added after 2 seconds.<br />
    Element 2 will be added after 4 seconds.
  </p>

  <script>
    // Element 1 after 2 sec
    setTimeout(() => {
      const div1 = document.createElement("div");

      div1.id = "element-1";
      div1.className = "dynamic-box";
      div1.innerHTML = "✅ Element 1 added to DOM after 2 seconds";

      document.body.appendChild(div1);

      console.log("Element 1 added");
    }, 2000);

    // Element 2 after 4 sec
    setTimeout(() => {
      const div2 = document.createElement("div");

      div2.id = "element-2";
      div2.className = "dynamic-box";
      div2.innerHTML = "🚀 Element 2 added to DOM after 4 seconds";

      document.body.appendChild(div2);

      console.log("Element 2 added");
    }, 2000);
  </script>

</body>
</html>
