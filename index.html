<!DOCTYPE html>
<html lang="en">
<head>
     <script referrerpolicy="no-referrer-when-downgrade" src="https://dev.visualwebsiteoptimizer.com/cloud-run-test/final/29000586.js" id="vwoCode"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Two Elements Added After 2 Seconds</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .dynamic-box {
      padding: 20px;
      margin-top: 20px;
      border-radius: 6px;
      font-weight: bold;
    }

    #element-1 {
      background: #d4f5d4;
      border: 1px solid #4caf50;
    }

    #element-2 {
      background: #dbeafe;
      border: 1px solid #3b82f6;
    }
  </style>
</head>
<body>

  <h1>Dynamic DOM Injection Example</h1>

  <p>Both elements will be added to DOM after 2 seconds.</p>

  <script>
    setTimeout(() => {

      // Element 1
      const div1 = document.createElement("div");
      div1.id = "element-1";
      div1.className = "dynamic-box";
      div1.innerHTML = "✅ Element 1 added after 2 seconds";

      // Element 2
      const div2 = document.createElement("div");
      div2.id = "element-2";
      div2.className = "dynamic-box";
      div2.innerHTML = "🚀 Element 2 added after 2 seconds";

      // Append both to DOM
      document.body.appendChild(div1);
      document.body.appendChild(div2);

      console.log("Both elements added to DOM");

    }, 2000);
  </script>

</body>
</html>
